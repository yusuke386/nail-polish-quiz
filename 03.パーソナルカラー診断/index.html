<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パーソナルカラー診断トレーニング</title>
<style>
  :root{
    --bg:#faf5f2;
    --card:#ffffff;
    --ink:#3b333a;
    --ink-soft:#8a7f85;
    --line:#ece2dc;
    --accent:#b47268;
    --accent-soft:#f3e4e0;
    --ok:#3f8a6e;
    --ok-soft:#e3f1ea;
    --ng:#c05a54;
    --ng-soft:#f7e3e1;
    --shadow:0 6px 24px rgba(90,60,55,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding:24px 18px calc(28px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:.04em;
    margin:0 0 4px;
  }
  .brand{
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:18px;
  }
  .lead{color:var(--ink-soft);font-size:14px;margin:0 0 22px}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:22px;
  }
  .screen{flex:1;display:flex;flex-direction:column;justify-content:center}
  #screen-quiz{justify-content:flex-start;padding-top:8px}
  .hidden{display:none!important}

  /* start */
  .field-label{font-size:13px;color:var(--ink-soft);margin:18px 0 8px}
  .seg{display:flex;gap:8px}
  .seg button{
    flex:1;
    padding:12px 0;
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
  }
  .seg button[aria-pressed="true"]{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn{
    display:block;width:100%;
    padding:15px 0;
    border:none;border-radius:14px;
    background:var(--accent);color:#fff;
    font-size:16px;font-weight:600;letter-spacing:.04em;
    cursor:pointer;
    margin-top:22px;
  }
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .best{font-size:13px;color:var(--ink-soft);margin-top:14px;text-align:center}

  /* lock */
  .text-input{
    display:block;width:100%;
    padding:13px 14px;
    border:1px solid var(--line);border-radius:12px;
    font-size:16px;color:var(--ink);
    background:#fff;
  }
  .text-input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .lock-error{min-height:20px;font-size:13px;color:var(--ng);margin-top:10px;text-align:center}

  /* quiz */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    font-size:13px;color:var(--ink-soft);margin-bottom:6px;
  }
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar > i{display:block;height:100%;background:var(--accent);transition:width .3s ease}

  .qcard{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:18px;
    font-size:15px;font-weight:600;text-align:center;margin-bottom:4px;
  }

  .persona{margin-bottom:4px}
  .swatch-row{display:flex;justify-content:center;gap:18px;margin:4px 0 10px}
  .swatch-item{display:flex;flex-direction:column;align-items:center;gap:4px}
  .swatch{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);box-shadow:var(--shadow)}
  .swatch-label{font-size:11px;color:var(--ink-soft)}
  .persona-desc{
    font-size:13px;color:var(--ink);text-align:center;line-height:1.6;
    padding:0 6px;margin-bottom:6px;
  }

  .q-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin:5px 0 5px}

  .choices{display:flex;flex-direction:column;gap:5px}
  .choice{
    width:100%;text-align:left;
    padding:9px 12px;
    border:1px solid var(--line);border-radius:12px;
    background:#fff;color:var(--ink);
    font-size:14px;letter-spacing:.01em;line-height:1.3;
    cursor:pointer;
    display:flex;align-items:center;gap:8px;
  }
  .choice .num{
    flex:none;width:19px;height:19px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent);
    font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .choice .chip{
    flex:none;width:16px;height:16px;border-radius:50%;
    border:1px solid rgba(0,0,0,.15);
  }
  .choice[disabled]{cursor:default}
  .choice.selected{border-color:var(--accent);background:var(--accent-soft)}
  .choice.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
  .choice.wrong{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);font-weight:600}

  /* シミュレーションモード：左＝おすすめの色（長い商品名）、右＝シーズン（短い単語） */
  .answer-row{display:flex;gap:8px;align-items:flex-start}
  .col-name{flex:1 1 auto;min-width:0}
  .col-series{flex:0 0 82px}
  .col-label{font-size:11px;color:var(--ink-soft);margin-bottom:4px}
  .choice.season{
    justify-content:center;text-align:center;
    padding:9px 4px;font-size:12px;font-weight:600;line-height:1.25;
  }

  .feedback{margin-top:6px;text-align:center;min-height:20px;font-size:13px;font-weight:600}
  .feedback.ok{color:var(--ok)}
  .feedback.ng{color:var(--ng)}
  .fullname{margin-top:8px;text-align:left;font-size:12px;color:var(--ink-soft);font-weight:400;line-height:1.7}
  .fullname b{color:var(--ink);font-weight:600}
  #btn-next{margin-top:8px}

  /* result */
  .score-big{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:44px;text-align:center;margin:6px 0 0;
  }
  .score-big small{font-size:20px;color:var(--ink-soft)}
  .score-sub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:8px}
  .review-title{font-size:13px;color:var(--ink-soft);margin:22px 0 10px}
  .miss{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .swatch-mini{width:36px;height:36px;border-radius:50%;flex:none;border:1px solid var(--line);background:var(--accent-soft)}
  .miss .m-kw{font-size:14px;font-weight:600}
  .miss .m-full{font-size:11px;color:var(--ink-soft)}
  .allright{text-align:center;color:var(--ok);font-weight:600;margin-top:18px}

  .foot{margin-top:22px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
  .switch-link{display:block;text-align:center;margin-top:10px;font-size:12px;color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== LOCK ===== -->
  <section id="screen-lock" class="screen">
    <div class="brand">PERSONAL COLOR</div>
    <h1>診断力トレーニング</h1>
    <p class="lead">合言葉を入力してください。</p>
    <div class="card">
      <input type="password" class="text-input" id="lock-input" placeholder="合言葉" autocomplete="off">
      <button class="btn" id="btn-unlock">入る</button>
      <div class="lock-error" id="lock-error"></div>
    </div>
  </section>

  <!-- ===== START ===== -->
  <section id="screen-start" class="screen hidden">
    <div class="brand">PERSONAL COLOR</div>
    <h1>診断力トレーニング</h1>
    <p class="lead">肌・髪・瞳の色から4シーズン診断法を練習します。新人研修用のテスト。</p>
    <div class="card">
      <div class="field-label">モード</div>
      <div class="seg" id="seg-mode">
        <button data-mode="knowledge" aria-pressed="true">知識クイズ</button>
        <button data-mode="simulation" aria-pressed="false">接客シミュレーション</button>
      </div>
      <div class="best" style="margin-top:6px" id="mode-desc">知識クイズ：4シーズン診断法の基礎知識を4択で確認します。</div>

      <div id="count-wrap">
        <div class="field-label">出題数</div>
        <div class="seg" id="seg-count">
          <button data-count="10" aria-pressed="true">10問</button>
          <button data-count="20" aria-pressed="false">20問</button>
          <button data-count="0" aria-pressed="false">全部</button>
        </div>
      </div>

      <button class="btn" id="btn-start">はじめる</button>
      <div class="best" id="best-line"></div>
    </div>
    <a class="switch-link" href="../index.html">← 別のクイズを選ぶ</a>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="screen-quiz" class="screen hidden">
    <div class="topbar">
      <span id="q-progress">問題 1 / 10</span>
      <span id="q-score">正解 0</span>
    </div>
    <div class="bar"><i id="q-bar" style="width:0%"></i></div>

    <div class="qcard hidden" id="q-question-text"></div>

    <div class="persona hidden" id="q-persona">
      <div class="swatch-row">
        <div class="swatch-item"><div class="swatch" id="sw-skin"></div><div class="swatch-label">肌</div></div>
        <div class="swatch-item"><div class="swatch" id="sw-hair"></div><div class="swatch-label">髪</div></div>
        <div class="swatch-item"><div class="swatch" id="sw-eye"></div><div class="swatch-label">瞳</div></div>
      </div>
      <div class="persona-desc" id="persona-desc"></div>
    </div>

    <div class="q-hint" id="q-hint"></div>

    <div class="choices" id="q-choices-single"></div>

    <div class="answer-row hidden" id="answer-row">
      <div class="col-name">
        <div class="col-label">おすすめの色</div>
        <div class="choices" id="q-choices-product"></div>
      </div>
      <div class="col-series">
        <div class="col-label">シーズン</div>
        <div class="choices" id="q-choices-season"></div>
      </div>
    </div>

    <div class="feedback" id="q-feedback"></div>
    <div class="fullname" id="q-fullname"></div>

    <button class="btn hidden" id="btn-next">次へ</button>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="screen-result" class="screen hidden">
    <div class="brand">Result</div>
    <div class="card">
      <div class="score-big" id="r-score">0<small> / 10</small></div>
      <div class="score-sub" id="r-sub"></div>
      <div id="r-review"></div>
      <button class="btn" id="btn-retry-miss">間違えた問題だけ復習</button>
      <button class="btn ghost" id="btn-again">最初からもう一度</button>
    </div>
  </section>

</div>

<script>

  ["4シーズンのうち「暖色系（イエベ）」に分類されるのはどれ？",

  ["秋タイプの色の特徴として最も近いのは？",

   "秋タイプは黄みを含む深みのある落ち着いたトーンが得意です。"],

/* ---------- 合言葉ロック ---------- */
// パスワードそのものではなく SHA-256 ハッシュを埋め込んで比較する
// （簡易的な鍵：ソースを見ても平文はわからないが、本物のサーバー認証ではない。既存クイズと同じ合言葉を利用）
const LOCK_HASH = "6a4a20a527695a2bc41d00d2143791c53384bddb290caa1cb26be5b1a4720c07";
const LOCK_KEY = "pc_quiz_unlocked_v1";
async function sha256Hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function tryUnlock(){
  const input = $("#lock-input");
  const val = input.value;
  const hash = await sha256Hex(val);
  if(hash === LOCK_HASH){
    try{ localStorage.setItem(LOCK_KEY, "1"); }catch(e){}
    $("#lock-error").textContent = "";
    show("start");
    renderBestLine();
  } else {
    $("#lock-error").textContent = "合言葉が違います";
    input.value = "";
    input.focus();
  }
}

/* ---------- おすすめ商品の紛らわしい選択肢（別シーズンの典型例から1点ずつ） ---------- */
function pickProductDistractors(persona){
  const otherSeasons = SEASON_VALUES.filter(s=>s!==persona.season);
  const distractors = otherSeasons
    .map(s=>shuffle(LIPSTICKS.filter(p=>p.typical && p.season===s))[0])
    .filter(Boolean);
  return shuffle([persona.recommended, ...distractors]);
}

/* ---------- クイズ生成 ---------- */
function buildQuiz(list){
  idx = 0; score = 0; missed = [];
  if(mode === "knowledge"){
    const pool = shuffle(QUESTIONS);
    const n = chosenCount===0 ? pool.length : Math.min(chosenCount, pool.length);
    const targets = list || pool.slice(0, n);
    quiz = targets.map(item=>{
      const idxs = shuffle([0,1,2,3]);
      const choices = idxs.map(i=>item.choices[i]);
      const correctIndex = idxs.indexOf(item.correctIndex);
      return { kind:"knowledge", item, choices, correctIndex };
    });
  } else {
    const pool = shuffle(PERSONAS);
    const targets = list || pool;
    quiz = targets.map(item=>({
      kind:"simulation",
      item,
      productOptions: pickProductDistractors(item),
      seasonOptions: SEASON_VALUES,
    }));
  }
}

/* ---------- 知識クイズの回答 ---------- */
function answerKnowledge(choiceIndex, btn){
  if(locked) return;
  locked = true;
  const cur = quiz[idx];
  const correct = choiceIndex === cur.correctIndex;
  if(correct){ score++; } else { missed.push(cur.item); }

  [...$("#q-choices-single").children].forEach((c,i)=>{
    c.disabled = true;
    if(i === cur.correctIndex) c.classList.add("correct");
    else if(i === choiceIndex) c.classList.add("wrong");
  });

  const fb = $("#q-feedback");
  fb.textContent = correct ? "正解！" : "不正解";
  fb.className = "feedback " + (correct ? "ok" : "ng");
  $("#q-fullname").textContent = cur.item.explain;
  $("#q-score").textContent = `正解 ${score}`;
  $("#btn-next").classList.remove("hidden");
}

function selectProduct(opt, btn){
  if(locked) return;
  selProduct = opt;
  [...$("#q-choices-product").children].forEach(c=>c.classList.toggle("selected", c===btn));
  maybeEvaluateSim();
}
function selectSeason(val, btn){
  if(locked) return;
  selSeason = val;
  [...$("#q-choices-season").children].forEach(c=>c.classList.toggle("selected", c===btn));
  maybeEvaluateSim();
}
function maybeEvaluateSim(){
  if(selProduct && selSeason) evaluateSim();
}
function evaluateSim(){
  const cur = quiz[idx];
  const persona = cur.item;
  locked = true;

  const productOk = selProduct.code === persona.recommended.code;
  const seasonOk = selSeason === persona.season;
  const correct = productOk && seasonOk;
  if(correct){ score++; } else { missed.push(persona); }

  [...$("#q-choices-product").children].forEach(c=>{
    c.disabled = true;
    c.classList.remove("selected");
    const label = c.querySelector("span:last-child").textContent;
    if(label === persona.recommended.kw) c.classList.add("correct");
    else if(!productOk && label === selProduct.kw) c.classList.add("wrong");
  });
  [...$("#q-choices-season").children].forEach(c=>{
    c.disabled = true;
    c.classList.remove("selected");
    if(c.textContent === SEASON_LABEL[persona.season]) c.classList.add("correct");
    else if(!seasonOk && c.textContent === SEASON_LABEL[selSeason]) c.classList.add("wrong");
  });

  const fb = $("#q-feedback");
  fb.textContent = correct ? "正解！" : "不正解";
  fb.className = "feedback " + (correct ? "ok" : "ng");

  const lines = [];
  lines.push(`<b>正解：${SEASON_LABEL[persona.season]}タイプ／${persona.recommended.kw}</b>`);
  lines.push(`【診断理由】${persona.seasonReason}`);
  lines.push(`【おすすめ理由】${persona.recommended.kw}は${persona.recommended.reason}のため、${SEASON_LABEL[persona.season]}タイプに似合う色です。`);
  if(!seasonOk){
    lines.push(`【季節の誤り】「${SEASON_LABEL[selSeason]}」は${SEASON_TRAIT[selSeason]}です。このお客様は上記の理由で${SEASON_LABEL[persona.season]}タイプなので当てはまりません。`);
  }
  if(!productOk){
    lines.push(`【商品の誤り】「${selProduct.kw}」は${selProduct.reason}で、${SEASON_LABEL[selProduct.season]}タイプ向けの色です。${SEASON_LABEL[persona.season]}タイプのこのお客様には合いません。`);
  }
  $("#q-fullname").innerHTML = lines.join("<br>");
  $("#q-score").textContent = `正解 ${score}`;
  $("#btn-next").classList.remove("hidden");
}

$("#btn-next").addEventListener("click", ()=>{
  if(idx < quiz.length-1){ idx++; renderQuestion(); }
  else { renderResult(); }
});

/* ---------- 結果 ---------- */
function renderResult(){
  $("#q-bar").style.width = "100%";
  const total = quiz.length;
  const pct = Math.round(score/total*100);
  $("#r-score").innerHTML = `${score}<small> / ${total}</small>`;
  $("#r-sub").textContent = `正答率 ${pct}%`;

  const key = bestKey();
  const b = loadBest();
  if(!b[key] || score/total > b[key].correct/b[key].total){
    b[key] = { correct: score, total }; saveBest(b);
  }

  const rv = $("#r-review");
  rv.innerHTML = "";
  if(missed.length === 0){
    rv.innerHTML = '<div class="allright">全問正解！おみごとです</div>';
    $("#btn-retry-miss").classList.add("hidden");
  } else {
    $("#btn-retry-miss").classList.remove("hidden");
    const t = document.createElement("div");
    t.className = "review-title";
    t.textContent = `間違えた問題（${missed.length}）`;
    rv.appendChild(t);
    missed.forEach(m=>{
      const row = document.createElement("div");
      row.className = "miss";
      if(mode === "knowledge"){
        row.innerHTML = `<div><div class="m-kw">${m.text}</div><div class="m-full">${m.explain}</div></div>`;
      } else {
        row.innerHTML = `<div class="swatch-mini" style="background:${m.skin}"></div><div><div class="m-kw">${SEASON_LABEL[m.season]} / ${m.recommended.kw}</div><div class="m-full">${m.desc}</div></div>`;
      }
      rv.appendChild(row);
    });
  }
  show("result");
}

$("#btn-retry-miss").addEventListener("click", ()=>{
  const list = shuffle(missed);
  buildQuiz(list);
  show("quiz"); renderQuestion();
});
$("#btn-again").addEventListener("click", ()=>{
  show("start"); renderBestLine();
});

/* ---------- スタート ---------- */
$("#btn-start").addEventListener("click", ()=>{
  buildQuiz(null);
  show("quiz");
  renderQuestion();
});

/* ---------- キーボード操作（PCテスト用・知識クイズのみ） ---------- */
document.addEventListener("keydown",(e)=>{
  if(!$("#screen-quiz").classList.contains("hidden") && mode==="knowledge"){
    if(["1","2","3","4"].includes(e.key)){
      const b = $("#q-choices-single").children[+e.key-1];
      if(b && !b.disabled) b.click();
    } else if((e.key === "Enter" || e.key === " ") && !$("#btn-next").classList.contains("hidden")){
      e.preventDefault(); $("#btn-next").click();
    }
  }
});

$("#btn-unlock").addEventListener("click", tryUnlock);
$("#lock-input").addEventListener("keydown", (e)=>{ if(e.key === "Enter") tryUnlock(); });

/* ---------- 初期表示：解錠済みならロック画面をスキップ ---------- */
(function initLock(){
  let unlocked = false;
  try{ unlocked = localStorage.getItem(LOCK_KEY) === "1"; }catch(e){}
  if(unlocked){ show("start"); renderBestLine(); }
  else { show("lock"); $("#lock-input").focus(); }
})();
</script>
</body>
</html>
