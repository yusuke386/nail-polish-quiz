<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRANGES DIVINES 色名クイズ</title>
<style>
  :root{
    --bg:#faf5f2;
    --card:#ffffff;
    --ink:#3b333a;
    --ink-soft:#8a7f85;
    --line:#ece2dc;
    --accent:#b47268;
    --accent-soft:#f3e4e0;
    --ok:#3f8a6e;
    --ok-soft:#e3f1ea;
    --ng:#c05a54;
    --ng-soft:#f7e3e1;
    --shadow:0 6px 24px rgba(90,60,55,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding:24px 18px calc(28px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:.04em;
    margin:0 0 4px;
  }
  .brand{
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:18px;
  }
  .lead{color:var(--ink-soft);font-size:14px;margin:0 0 22px}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:22px;
  }
  .screen{flex:1;display:flex;flex-direction:column;justify-content:center}
  .hidden{display:none!important}

  /* start */
  .field-label{font-size:13px;color:var(--ink-soft);margin:18px 0 8px}
  .seg{display:flex;gap:8px}
  .seg button{
    flex:1;
    padding:12px 0;
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
  }
  .seg button[aria-pressed="true"]{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn{
    display:block;width:100%;
    padding:15px 0;
    border:none;border-radius:14px;
    background:var(--accent);color:#fff;
    font-size:16px;font-weight:600;letter-spacing:.04em;
    cursor:pointer;
    margin-top:22px;
  }
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .best{font-size:13px;color:var(--ink-soft);margin-top:14px;text-align:center}

  /* lock */
  .text-input{
    display:block;width:100%;
    padding:13px 14px;
    border:1px solid var(--line);border-radius:12px;
    font-size:16px;color:var(--ink);
    background:#fff;
  }
  .text-input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .lock-error{min-height:20px;font-size:13px;color:var(--ng);margin-top:10px;text-align:center}

  /* quiz */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    font-size:13px;color:var(--ink-soft);margin-bottom:6px;
  }
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar > i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
  .photo-row{display:flex;justify-content:center;align-items:flex-start;gap:8px;flex-wrap:wrap}
  .photo{
    width:36%;max-width:150px;margin:0 auto;aspect-ratio:1/1;
    border-radius:14px;overflow:hidden;
    background:var(--accent-soft) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="%23b47268" stroke-width="1.2"><circle cx="12" cy="12" r="9"/></svg>') center/40px no-repeat;
    display:flex;align-items:center;justify-content:center;
    cursor:zoom-in;
    position:relative;
  }
  .photo-sm{width:30%;max-width:118px;margin:0}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .err{font-size:12px;color:var(--ink-soft);padding:14px;text-align:center}
  /* 商品コードバッジ：写真右上に表示するヒント（回答前後とも常時表示） */
  .code-badge{
    position:absolute;
    top:6px; right:6px;
    background:rgba(59,51,58,.82);
    color:#fff;
    font-size:12px;
    font-weight:700;
    letter-spacing:.03em;
    padding:3px 8px;
    border-radius:999px;
    pointer-events:none;
  }
  .q-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin:5px 0 5px}
  /* 色名（左）とシリーズ番号（右）を横並びにして、スマホでもスクロールなしで両方回答できるようにする */
  .answer-row{display:flex;gap:8px;align-items:flex-start}
  .col-name{flex:1 1 auto;min-width:0}
  .col-series{flex:0 0 64px}
  .col-label{font-size:11px;color:var(--ink-soft);margin-bottom:4px}
  .choices{display:flex;flex-direction:column;gap:5px}
  .choice{
    width:100%;text-align:left;
    padding:7px 10px;
    border:1px solid var(--line);border-radius:11px;
    background:#fff;color:var(--ink);
    font-size:13px;letter-spacing:.01em;line-height:1.3;
    cursor:pointer;
    display:flex;align-items:center;gap:7px;
  }
  .choice .num{
    flex:none;width:17px;height:17px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent);
    font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .choice.series{
    justify-content:center;text-align:center;
    padding:9px 4px;font-size:17px;font-weight:600;
  }
  .choice[disabled]{cursor:default}
  .choice.selected{border-color:var(--accent);background:var(--accent-soft)}
  .choice.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
  .choice.correct .num{background:var(--ok);color:#fff}
  .choice.wrong{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);font-weight:600}
  .choice.wrong .num{background:var(--ng);color:#fff}
  .feedback{margin-top:6px;text-align:center;min-height:20px;font-size:13px;font-weight:600}
  .feedback.ok{color:var(--ok)}
  .feedback.ng{color:var(--ng)}
  .fullname{margin-top:4px;text-align:center;font-size:12px;color:var(--ink-soft);font-weight:400}
  #btn-next{margin-top:8px}

  /* result */
  .score-big{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:44px;text-align:center;margin:6px 0 0;
  }
  .score-big small{font-size:20px;color:var(--ink-soft)}
  .score-sub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:8px}
  .review-title{font-size:13px;color:var(--ink-soft);margin:22px 0 10px}
  .miss{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .miss img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--accent-soft);flex:none}
  .miss .m-kw{font-size:14px;font-weight:600}
  .miss .m-full{font-size:11px;color:var(--ink-soft)}
  .allright{text-align:center;color:var(--ok);font-weight:600;margin-top:18px}

  /* zoom overlay */
  .zoom{
    position:fixed;inset:0;background:rgba(35,25,28,.92);
    display:flex;align-items:center;justify-content:center;padding:20px;
    cursor:zoom-out;z-index:50;
  }
  .zoom-inner{
    position:relative;
    width:min(calc(100vw - 40px), calc(100vh - 40px));
    height:min(calc(100vw - 40px), calc(100vh - 40px));
  }
  .zoom-inner img{width:100%;height:100%;object-fit:contain;border-radius:12px;display:block}
  .zoom-inner .code-badge{top:12px;right:12px;font-size:16px;padding:6px 14px}

  .foot{margin-top:22px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
  .switch-link{display:block;text-align:center;margin-top:10px;font-size:12px;color:var(--accent);text-decoration:none}
</style>
</head>

<div class="wrap">

  <!-- ===== LOCK ===== -->
  <section id="screen-lock" class="screen">
    <div class="brand">FRANGES DIVINES</div>
    <h1>色名クイズ</h1>
    <p class="lead">合言葉を入力してください。</p>
    <div class="card">
      <input type="password" class="text-input" id="lock-input" placeholder="合言葉" autocomplete="off">
      <button class="btn" id="btn-unlock">入る</button>
      <div class="lock-error" id="lock-error"></div>
    </div>
  </section>

  <!-- ===== START ===== -->
  <section id="screen-start" class="screen hidden">
    <div class="brand">FRANGES DIVINES</div>
    <h1>色名クイズ</h1>
    <p class="lead">写真を見て、ルージュ ウーフォリ ドゥ ラ ソワ の色名とシリーズ番号を当てる練習です。新人研修用のテスト。</p>
    <div class="card">
      <div class="field-label">難易度</div>
      <div class="seg" id="seg-difficulty">
        <button data-difficulty="normal" aria-pressed="true">通常</button>
        <button data-difficulty="hard" aria-pressed="false">上級</button>
      </div>
      <div class="best" style="margin-top:6px">通常:写真右上にコード表示／上級:唇写真のみで判定</div>
      <div class="field-label">出題数</div>
      <div class="seg" id="seg-count">
        <button data-count="10" aria-pressed="true">10問</button>
        <button data-count="20" aria-pressed="false">20問</button>
        <button data-count="0" aria-pressed="false">全部</button>
      </div>
      <button class="btn" id="btn-start">はじめる</button>
      <div class="best" id="best-line"></div>
    </div>
    <div class="foot">画像は f-divines.com から読み込みます（要ネット接続）</div>
    <a class="switch-link" href="../index.html">← 別のクイズを選ぶ</a>
  </section>

  <!-- ===== LOADING ===== -->
  <section id="screen-loading" class="screen hidden">
    <div class="card" style="text-align:center">
      <div class="brand" style="margin:0 0 10px">Loading</div>
      <p class="lead" style="margin:0">画像を読み込んでいます…<br><span id="load-count" style="font-size:13px"></span></p>
    </div>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="screen-quiz" class="screen hidden">
    <div class="topbar">
      <span id="q-progress">問題 1 / 10</span>
      <span id="q-score">正解 0</span>
    </div>
    <div class="bar"><i id="q-bar" style="width:0%"></i></div>

    <div class="photo-row" id="q-photo-row" role="img" aria-label="商品写真"></div>
    <div class="q-hint" id="q-hint">このコードの色名とシリーズ番号は？（タップで画像拡大）</div>

    <div class="answer-row">
      <div class="col-name">
        <div class="col-label">色名</div>
        <div class="choices" id="q-choices"></div>
      </div>
      <div class="col-series">
        <div class="col-label">分類</div>
        <div class="choices" id="q-choices-series"></div>
      </div>
    </div>

    <div class="feedback" id="q-feedback"></div>
    <div class="fullname" id="q-fullname"></div>

    <button class="btn hidden" id="btn-next">次へ</button>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="screen-result" class="screen hidden">
    <div class="brand">Result</div>
    <div class="card">
      <div class="score-big" id="r-score">0<small> / 10</small></div>
      <div class="score-sub" id="r-sub"></div>
      <div id="r-review"></div>
      <button class="btn" id="btn-retry-miss">間違えた問題だけ復習</button>
      <button class="btn ghost" id="btn-again">最初からもう一度</button>
    </div>
  </section>

</div>

  ["D7","青雲","SEIUN","Ⅲ","fdlip_wholeD7_5b5029ce-0f7b-4bce-b810-90d734c5f410.jpg",["fdswatch_D7-B.jpg","fdswatch_D7_b9272fc8-7ca6-4e20-b555-8f1a53f8b01b.jpg"]],
  ["D8","落星","OCHIBOSHI","Ⅱ","fdlip_wholeD8_fff86205-5864-4d23-82a5-757197867f53.jpg",["fdswatch_D8-B.jpg","fdswatch_D8_cb14de6a-f978-45ae-ae94-e8084a5476c8.jpg"]],
  ["D9","夕闇","YUUYAMI","Ⅲ","fdlip_wholeD9_bfaa634e-1707-41c2-9636-6738fe22def0.jpg",["fdswatch_D9-B.jpg","fdswatch_D9_f4418292-50d7-4846-ba3f-33f0583b9ba7.jpg"]],
  ["D10","暮雨の天","BOU NO TEN","Ⅱ","fdlip_wholeD10_4621c151-06d1-4610-8054-912495919144.jpg",["fdswatch_D10-B.jpg","fdswatch_D10_aae1ba34-ecce-4884-80a4-f374714298ae.jpg"]],
];
const PRODUCTS = RAW.map(([code,kanji,romaji,series,img,swatch])=>({
  code,
  kanji,
  romaji,
  series,
  kw: `${kanji} ${romaji}`,
  img: IMG_BASE + img,
  swatchImgs: swatch.map(f=>IMG_BASE+f),
  fullName: `${code}　${kanji}${romaji}（${series}）`,
}));

/* ---------- 合言葉ロック ---------- */
// パスワードそのものではなく SHA-256 ハッシュを埋め込んで比較する
// （簡易的な鍵：ソースを見ても平文はわからないが、本物のサーバー認証ではない）
const LOCK_HASH = "6a4a20a527695a2bc41d00d2143791c53384bddb290caa1cb26be5b1a4720c07";
const LOCK_KEY = "fd_quiz_unlocked_v1";
async function sha256Hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function tryUnlock(){
  const input = $("#lock-input");
  const val = input.value;
  const hash = await sha256Hex(val);
  if(hash === LOCK_HASH){
    try{ localStorage.setItem(LOCK_KEY, "1"); }catch(e){}
    $("#lock-error").textContent = "";
    show("start");
    renderBestLine();
  } else {
    $("#lock-error").textContent = "合言葉が違います";
    input.value = "";
    input.focus();
  }
}

/* ---------- 状態 ---------- */
const BEST_KEY = "fd_quiz_best_v1";
let usableByMode = { normal:null, hard:null }; // 画像読み込みに成功した商品（難易度ごと）
let difficulty = "normal"; // "normal" | "hard"
let chosenCount = 10;     // 0 = 全部
let quiz = [];            // 出題リスト
let idx = 0;
let score = 0;
let missed = [];
const SERIES_VALUES = ["Ⅰ","Ⅱ","Ⅲ"];
let selName = null;    // 選択中の色名（未確定）
let selSeries = null;  // 選択中のシリーズ番号（未確定）
let locked = false;    // 両方確定して結果表示済みか

/* ---------- ユーティリティ ---------- */
const $ = (s)=>document.querySelector(s);
const shuffle = (a)=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
function show(screen){
  ["lock","start","loading","quiz","result"].forEach(s=>$("#screen-"+s).classList.toggle("hidden", s!==screen));
}
function loadBest(){ try{ return JSON.parse(localStorage.getItem(BEST_KEY)||"{}"); }catch(e){ return {}; } }
function saveBest(obj){ try{ localStorage.setItem(BEST_KEY, JSON.stringify(obj)); }catch(e){} }
function renderBestLine(){
  const b = loadBest();
  const key = `${difficulty}:${chosenCount}`;
  const el = $("#best-line");
  if(b[key]) el.textContent = `自己ベスト（${difficulty==="hard"?"上級":"通常"}/${chosenCount===0?"全部":chosenCount+"問"}）: ${b[key].correct} / ${b[key].total}`;
  else el.textContent = "";
}

/* ---------- 難易度・出題数の選択 ---------- */
$("#seg-difficulty").addEventListener("click",(e)=>{
  const btn = e.target.closest("button"); if(!btn) return;
  [...e.currentTarget.children].forEach(b=>b.setAttribute("aria-pressed", b===btn));
  difficulty = btn.dataset.difficulty;
  renderBestLine();
});
$("#seg-count").addEventListener("click",(e)=>{
  const btn = e.target.closest("button"); if(!btn) return;
  [...e.currentTarget.children].forEach(b=>b.setAttribute("aria-pressed", b===btn));
  chosenCount = parseInt(btn.dataset.count,10);
  renderBestLine();
});

/* ---------- 画像プリロード ---------- */
function preloadUrl(url){
  return new Promise((res)=>{
    const im = new Image();
    im.onload = ()=>res(true);
    im.onerror = ()=>res(false);
    im.src = url;
  });
}
async function ensureImages(mode){
  if(usableByMode[mode]) return;
  show("loading");
  let done = 0;
  const results = await Promise.all(PRODUCTS.map(async p=>{
    const urls = mode === "hard" ? p.swatchImgs : [p.img];
    const oks = await Promise.all(urls.map(preloadUrl));
    done++; $("#load-count").textContent = `${done} / ${PRODUCTS.length}`;
    return { p, ok: oks.every(Boolean) };
  }));
  let usable = results.filter(r=>r.ok).map(r=>r.p);
  if(usable.length < 4){ // まず起きないが保険
    usable = PRODUCTS.slice();
  }
  usableByMode[mode] = usable;
}

/* ---------- クイズ生成 ---------- */
function buildQuiz(list){
  const usable = usableByMode[difficulty];
  const pool = shuffle(usable);
  const n = chosenCount===0 ? pool.length : Math.min(chosenCount, pool.length);
  const targets = list || pool.slice(0, n);
  quiz = targets.map(correct=>{
    const distractors = shuffle(usable.filter(p=>p.kw!==correct.kw)).slice(0,3);
    const options = shuffle([correct, ...distractors]);
    return { correct, options, seriesOptions: SERIES_VALUES };
  });
  idx = 0; score = 0; missed = [];
}

/* ---------- 出題描画 ---------- */
function renderQuestion(){
  const q = quiz[idx];
  $("#q-progress").textContent = `問題 ${idx+1} / ${quiz.length}`;
  $("#q-score").textContent = `正解 ${score}`;
  $("#q-bar").style.width = (idx/quiz.length*100) + "%";

  selName = null; selSeries = null; locked = false;

  $("#q-hint").textContent = difficulty === "hard"
    ? "この唇写真から色名とシリーズ番号は？（タップで画像拡大）"
    : "このコードの色名とシリーズ番号は？（タップで画像拡大）";

  const photoRow = $("#q-photo-row");
  photoRow.innerHTML = "";
  if(difficulty === "hard"){
    q.correct.swatchImgs.forEach(url=> photoRow.appendChild(makePhotoEl(url, null, true)));
  } else {
    photoRow.appendChild(makePhotoEl(q.correct.img, q.correct.code, false));
  }

  const nameWrap = $("#q-choices");
  nameWrap.innerHTML = "";
  q.options.forEach((opt,i)=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="num">${i+1}</span><span>${opt.kw}</span>`;
    b.addEventListener("click", ()=>selectName(opt, b));
    nameWrap.appendChild(b);
  });

  const seriesWrap = $("#q-choices-series");
  seriesWrap.innerHTML = "";
  q.seriesOptions.forEach((val)=>{
    const b = document.createElement("button");
    b.className = "choice series";
    b.textContent = val;
    b.addEventListener("click", ()=>selectSeries(val, b));
    seriesWrap.appendChild(b);
  });

  $("#q-feedback").textContent = "";
  $("#q-feedback").className = "feedback";
  $("#q-fullname").textContent = "";
  $("#btn-next").classList.add("hidden");
  $("#btn-next").textContent = idx === quiz.length-1 ? "結果を見る" : "次へ";
}

function selectName(opt, btn){
  if(locked) return;
  selName = opt;
  [...$("#q-choices").children].forEach(c=>c.classList.toggle("selected", c===btn));
  maybeEvaluate();
}
function selectSeries(val, btn){
  if(locked) return;
  selSeries = val;
  [...$("#q-choices-series").children].forEach(c=>c.classList.toggle("selected", c===btn));
  maybeEvaluate();
}
function maybeEvaluate(){
  if(selName && selSeries) evaluateAnswer();
}

function evaluateAnswer(){
  const q = quiz[idx];
  locked = true;

  const nameOk = selName.kw === q.correct.kw;
  const seriesOk = selSeries === q.correct.series;
  const correct = nameOk && seriesOk;
  if(correct){ score++; }
  else { missed.push(q.correct); }

  [...$("#q-choices").children].forEach(c=>{
    c.disabled = true;
    c.classList.remove("selected");
    const kw = c.querySelector("span:last-child").textContent;
    if(kw === q.correct.kw) c.classList.add("correct");
    else if(!nameOk && kw === selName.kw) c.classList.add("wrong");
  });
  [...$("#q-choices-series").children].forEach(c=>{
    c.disabled = true;
    c.classList.remove("selected");
    const val = c.textContent;
    if(val === q.correct.series) c.classList.add("correct");
    else if(!seriesOk && val === selSeries) c.classList.add("wrong");
  });

  const fb = $("#q-feedback");
  fb.textContent = correct ? "正解！" : "不正解";
  fb.className = "feedback " + (correct ? "ok" : "ng");
  $("#q-fullname").textContent = q.correct.fullName;
  $("#q-score").textContent = `正解 ${score}`;
  $("#btn-next").classList.remove("hidden");
}

$("#btn-next").addEventListener("click", ()=>{
  if(idx < quiz.length-1){ idx++; renderQuestion(); }
  else { renderResult(); }
});

/* ---------- 結果 ---------- */
function renderResult(){
  $("#q-bar").style.width = "100%";
  const total = quiz.length;
  const pct = Math.round(score/total*100);
  $("#r-score").innerHTML = `${score}<small> / ${total}</small>`;
  $("#r-sub").textContent = `正答率 ${pct}%`;

  // 自己ベスト更新（同じ出題数のときだけ）
  const key = `${difficulty}:${chosenCount}`;
  const b = loadBest();
  if(!b[key] || score/total > b[key].correct/b[key].total){
    b[key] = { correct: score, total }; saveBest(b);
  }

  const rv = $("#r-review");
  rv.innerHTML = "";
  if(missed.length === 0){
    rv.innerHTML = '<div class="allright">全問正解！おみごとです</div>';
    $("#btn-retry-miss").classList.add("hidden");
  } else {
    $("#btn-retry-miss").classList.remove("hidden");
    const t = document.createElement("div");
    t.className = "review-title";
    t.textContent = `間違えた商品（${missed.length}）`;
    rv.appendChild(t);
    missed.forEach(p=>{
      const row = document.createElement("div");
      row.className = "miss";
      row.innerHTML = `<img src="${p.img}" alt=""><div><div class="m-kw">${p.kw}</div><div class="m-full">${p.fullName}</div></div>`;
      rv.appendChild(row);
    });
  }
  show("result");
}

$("#btn-retry-miss").addEventListener("click", ()=>{
  const list = shuffle(missed);
  buildQuiz(list);
  show("quiz"); renderQuestion();
});
$("#btn-again").addEventListener("click", ()=>{
  show("start"); renderBestLine();
});

/* ---------- スタート ---------- */
$("#btn-start").addEventListener("click", async ()=>{
  await ensureImages(difficulty);
  buildQuiz(null);
  show("quiz");
  renderQuestion();
});

/* ---------- 写真1枚分の要素を作る（タップで拡大） ---------- */
function makePhotoEl(url, badgeText, small){
  const box = document.createElement("div");
  box.className = "photo" + (small ? " photo-sm" : "");
  const im = new Image();
  im.alt = "商品写真";
  im.onerror = ()=>{ box.innerHTML = '<div class="err">画像を読み込めませんでした</div>'; };
  im.src = url;
  box.appendChild(im);
  if(badgeText){
    const badge = document.createElement("div");
    badge.className = "code-badge";
    badge.textContent = badgeText;
    box.appendChild(badge);
  }
  box.addEventListener("click", ()=>{
    const ov = document.createElement("div");
    ov.className = "zoom";
    const badgeHtml = badgeText ? `<div class="code-badge">${badgeText}</div>` : "";
    ov.innerHTML = `<div class="zoom-inner"><img src="${url}" alt="">${badgeHtml}</div>`;
    ov.addEventListener("click", ()=>ov.remove());
    document.body.appendChild(ov);
  });
  return box;
}

/* ---------- キーボード操作（PCテスト用） ---------- */
document.addEventListener("keydown",(e)=>{
  if(!$("#screen-quiz").classList.contains("hidden")){
    if(["1","2","3","4"].includes(e.key)){
      const b = $("#q-choices").children[+e.key-1];
      if(b && !b.disabled) b.click();
    } else if((e.key === "Enter" || e.key === " ") && !$("#btn-next").classList.contains("hidden")){
      e.preventDefault(); $("#btn-next").click();
    }
  }
});

$("#btn-unlock").addEventListener("click", tryUnlock);
$("#lock-input").addEventListener("keydown", (e)=>{ if(e.key === "Enter") tryUnlock(); });

/* ---------- 初期表示：解錠済みならロック画面をスキップ ---------- */
(function initLock(){
  let unlocked = false;
  try{ unlocked = localStorage.getItem(LOCK_KEY) === "1"; }catch(e){}
  if(unlocked){ show("start"); renderBestLine(); }
  else { show("lock"); $("#lock-input").focus(); }
})();
</script>
