<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff5f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="みはるんお花日記">
<title>みはるんお花日記</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#fff4f7;
    --card:#ffffff;
    --ink:#5a4049;
    --ink-soft:#a88c97;
    --line:#ffd9e4;
    --accent:#f28bab;
    --accent-deep:#d9658a;
    --accent-soft:#ffe6ee;
    --yellow:#ffd66e;
    --leaf:#9fcf8c;
    --shadow:0 6px 18px rgba(217,101,138,.16);
    --flower:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='27' r='24'/><circle cx='72' cy='43' r='24'/><circle cx='63.5' cy='69' r='24'/><circle cx='36.5' cy='69' r='24'/><circle cx='28' cy='43' r='24'/><circle cx='50' cy='50' r='26'/></svg>");
    --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    color:var(--ink);
    font-family:var(--font);
    line-height:1.6;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    /* 背景に小さなお花を散らす */
    background-color:var(--bg);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><g opacity='.55'><g transform='translate(18 26) scale(.2)' fill='%23ffc9d8'><circle cx='50' cy='27' r='24'/><circle cx='72' cy='43' r='24'/><circle cx='63.5' cy='69' r='24'/><circle cx='36.5' cy='69' r='24'/><circle cx='28' cy='43' r='24'/><circle cx='50' cy='50' r='12' fill='%23fff0b8'/></g><g transform='translate(128 92) scale(.14)' fill='%23ffdbe6'><circle cx='50' cy='27' r='24'/><circle cx='72' cy='43' r='24'/><circle cx='63.5' cy='69' r='24'/><circle cx='36.5' cy='69' r='24'/><circle cx='28' cy='43' r='24'/><circle cx='50' cy='50' r='12' fill='%23fff0b8'/></g><g transform='translate(52 146) scale(.12)' fill='%23ffd2c4'><circle cx='50' cy='27' r='24'/><circle cx='72' cy='43' r='24'/><circle cx='63.5' cy='69' r='24'/><circle cx='36.5' cy='69' r='24'/><circle cx='28' cy='43' r='24'/><circle cx='50' cy='50' r='12' fill='%23fff0b8'/></g><ellipse cx='100' cy='40' rx='7' ry='3.5' fill='%23d6ecc9' transform='rotate(-30 100 40)'/><ellipse cx='170' cy='170' rx='7' ry='3.5' fill='%23d6ecc9' transform='rotate(25 170 170)'/><circle cx='160' cy='30' r='3' fill='%23ffc9d8'/><circle cx='20' cy='110' r='2.5' fill='%23ffe3a8'/></g></svg>");
    background-size:200px 200px;
  }
  button{font-family:inherit}
  .ic{width:1em;height:1em;vertical-align:-.12em;flex:none}
  .wrap{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding:0 calc(8px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    display:flex;
    flex-direction:column;
  }
  /* 地図タブでは地図を画面いっぱいに */
  body.tab-map .wrap{padding-bottom:calc(8px + env(safe-area-inset-bottom))}

  /* ヘッダー */
  .hero{text-align:center;margin:0 0 6px}
  /* タイトルとタブは、スクロールしても画面の上に残す */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    margin:0 calc(-8px - env(safe-area-inset-right)) 8px calc(-8px - env(safe-area-inset-left));
    padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));
    background:rgba(255,244,247,.97);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    transition:box-shadow .2s;
  }
  .topbar.scrolled{box-shadow:0 6px 14px -8px rgba(217,101,138,.35)}
  .brand{
    font-size:11px;
    letter-spacing:.3em;
    color:var(--accent);
    margin-bottom:0;
  }
  h1{
    font-weight:700;
    font-size:23px;
    line-height:1.35;
    letter-spacing:.1em;
    margin:0;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  h1 .ic{width:22px;height:22px}
  h1 .ic.l{color:var(--accent);transform:rotate(-12deg)}
  h1 .ic.r{color:#ffb3c7;transform:rotate(14deg)}
  .sub{margin:0;font-size:11px;line-height:1.4;color:var(--ink-soft)}

  /* タブ */
  .tabs{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,.75);
    border:2px solid var(--line);
    border-radius:999px;
    padding:3px;
  }
  .tabs button{
    flex:1;
    appearance:none;
    border:none;
    background:none;
    color:var(--accent-deep);
    font-size:14px;
    font-weight:700;
    padding:6px 0;
    border-radius:999px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .tabs button .ic{width:18px;height:18px}
  .tabs button.on{
    background:linear-gradient(135deg,#ffa3bd,var(--accent));
    color:#fff;
    box-shadow:0 3px 10px rgba(217,101,138,.3);
  }
  .view{display:none}
  .view.on{display:block;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 期間ナビ */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .nav .label{
    font-size:17px;
    font-weight:700;
    letter-spacing:.05em;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:999px;
    padding:2px 18px;
  }
  .nav button{
    appearance:none;
    border:none;
    background:var(--accent-soft);
    color:var(--accent-deep);
    width:34px;height:34px;
    border-radius:50%;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
  }

  /* 月カレンダー */
  .cal{
    position:relative;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:8px 3px 4px;
  }
  .cal::before,.cal::after{
    content:"";
    position:absolute;
    pointer-events:none;
    width:34px;height:34px;
    -webkit-mask:var(--flower) center/contain no-repeat;
    mask:var(--flower) center/contain no-repeat;
  }
  .cal::before{top:-12px;left:-6px;background:var(--accent);transform:rotate(-15deg)}
  .cal::after{top:-9px;right:-4px;width:26px;height:26px;background:#ffc1d2;transform:rotate(20deg)}
  .cal-row{
    display:grid;
    grid-template-columns:18px repeat(7,1fr);
    gap:2px;
    margin-bottom:2px;
  }
  .cal-head div{
    text-align:center;
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    padding-bottom:2px;
  }
  .cal-head .sun{color:#e46a86}
  .cal-head .sat{color:#72a2d6}
  .wk{
    appearance:none;
    border:none;
    background:linear-gradient(#e9f5e2,#d8eecd);
    color:#6a9a58;
    border-radius:9px;
    font-size:10px;
    font-weight:700;
    writing-mode:vertical-rl;
    letter-spacing:.15em;
    cursor:pointer;
    padding:0;
  }
  .day{
    position:relative;
    aspect-ratio:1/1.18;
    border-radius:14px;
    background:#fff8fa;
    border:none;
    overflow:visible;
    cursor:pointer;
    padding:0;
    appearance:none;
  }
  .day .n{
    position:absolute;
    top:2px;left:3px;
    z-index:2;
    min-width:18px;height:18px;
    line-height:18px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    color:var(--ink);
    border-radius:9px;
  }
  .day.has-photo .n{background:rgba(255,255,255,.9);color:var(--accent-deep)}
  /* 写真をお花の形に切り抜く */
  .day img{
    position:absolute;
    left:6%;right:6%;bottom:6%;
    width:88%;
    aspect-ratio:1;
    object-fit:cover;
    -webkit-mask:var(--flower) center/contain no-repeat;
    mask:var(--flower) center/contain no-repeat;
  }
  .day .mini{
    position:absolute;
    left:50%;bottom:10%;
    width:44%;height:auto;aspect-ratio:1;
    transform:translateX(-50%);
    color:#ffb3c7;
  }
  .day.out{opacity:.35}
  .day.today{background:var(--accent-soft)}
  .day.today .n{background:var(--accent);color:#fff}
  .day.future{cursor:default}
  .cal-note{
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:14px;
  }

  /* 週表示（ポラロイド風） */
  .wday{
    position:relative;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:8px 10px 8px;
    margin-bottom:6px;
    cursor:pointer;
  }
  .wday.today{border-color:var(--accent)}
  .wday .wd{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,#ffa3bd,var(--accent));
    border-radius:999px;
    padding:1px 12px 1px 8px;
    margin-bottom:6px;
  }
  .wday .wd .ic{color:#fff}
  .wday.empty .wd{background:var(--accent-soft);color:var(--accent-deep)}
  .wday.empty .wd .ic{color:var(--accent)}
  .wday .ph{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:0 2px 8px;
  }
  .wday .ph img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    background:#fff;
    padding:4px 4px 12px;
    border-radius:4px;
    box-shadow:0 3px 8px rgba(90,64,73,.18);
  }
  .wday .ph img:nth-child(1){transform:rotate(-3deg)}
  .wday .ph img:nth-child(2){transform:rotate(2deg)}
  .wday .ph img:nth-child(3){transform:rotate(-1.5deg)}
  .wday .memo{
    font-size:14px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .wday .none{font-size:12px;color:var(--ink-soft)}

  /* 地図 */
  #map{
    position:relative;
    z-index:0;
    flex:1;
    min-height:320px;
    border-radius:26px;
    border:3px solid #fff;
    box-shadow:var(--shadow),0 0 0 2px var(--line);
    overflow:hidden;
    background:var(--accent-soft);
  }
  #view-map.on{display:flex;flex-direction:column;flex:1}
  .map-msg{
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:4px;
  }
  /* 地図のピン：お花の真ん中に写真、下に茎と葉っぱ */
  .pin{position:relative;width:62px;height:78px}
  .pin .petals{
    position:absolute;top:0;left:0;
    width:62px;height:62px;
    background:var(--accent);
    -webkit-mask:var(--flower) center/contain no-repeat;
    mask:var(--flower) center/contain no-repeat;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));
  }
  .pin .ph{
    position:absolute;top:13px;left:13px;
    width:36px;height:36px;
    border-radius:50%;
    border:2px solid #fff;
    overflow:hidden;
    background:var(--yellow);
    display:flex;align-items:center;justify-content:center;
  }
  .pin .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pin .stem{
    position:absolute;left:29.5px;top:56px;
    width:3px;height:22px;
    background:#7cb86a;
    border-radius:2px;
  }
  .pin .stem::after{
    content:"";
    position:absolute;left:2px;top:6px;
    width:12px;height:6px;
    background:var(--leaf);
    border-radius:0 10px 0 10px;
  }
  .leaflet-popup-content-wrapper{border-radius:18px;font-family:var(--font)}
  .pop{min-width:170px;max-width:220px;font-family:var(--font)}
  .pop .pd{font-size:12px;font-weight:700;color:var(--accent-deep);margin-bottom:4px}
  .pop .pm{font-size:13px;color:var(--ink);margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
  .pop button{
    appearance:none;border:none;
    background:linear-gradient(135deg,#ffa3bd,var(--accent));color:#fff;
    font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;
  }

  /* ヘッダー右上の設定ボタン */
  .hero{position:relative}
  .gear{
    position:absolute;
    top:4px;right:0;
    width:34px;height:34px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    box-shadow:0 0 0 2px var(--line);
    color:var(--accent);
    padding:7px;
    cursor:pointer;
  }
  .gear svg{width:100%;height:100%;display:block}

  /* カレンダーの下：選んだ日のお花 */
  .day.sel{box-shadow:0 0 0 2px var(--accent-deep) inset}

  /* ---------- 季節のカレンダー（月ごとの背景と小さなイラスト） ---------- */
  /* ページ全体の背景：見ている月のイメージに合わせる */
  body[data-season="1"]{
    background-color:#fff6ea;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><g opacity='.8'><circle cx='30' cy='24' r='2.2' fill='%23e6c26e'/><circle cx='150' cy='40' r='1.6' fill='%23e6c26e'/><circle cx='96' cy='98' r='1.8' fill='%23e6c26e'/><circle cx='20' cy='160' r='1.5' fill='%23e6c26e'/><circle cx='170' cy='150' r='2.2' fill='%23e6c26e'/><circle cx='120' cy='182' r='1.4' fill='%23e6c26e'/><circle cx='60' cy='66' r='1.2' fill='%23e6c26e'/><circle cx='186' cy='94' r='1.3' fill='%23e6c26e'/><g transform='translate(66 150) rotate(-12) scale(0.8)'><path d='M0 9 L-10.5 -3 A14 14 0 0 1 10.5 -3 Z' fill='%23e8747c'/><path d='M0 9 L-6 1 A8.5 8.5 0 0 1 6 1 Z' fill='%23f4cf73'/><circle cx='0' cy='8' r='1.4' fill='%23c9a15a'/></g><g transform='translate(160 86) rotate(16) scale(0.65)'><path d='M0 9 L-10.5 -3 A14 14 0 0 1 10.5 -3 Z' fill='%23e8747c'/><path d='M0 9 L-6 1 A8.5 8.5 0 0 1 6 1 Z' fill='%23f4cf73'/><circle cx='0' cy='8' r='1.4' fill='%23c9a15a'/></g><g transform='translate(20 70) rotate(8) scale(0.5)'><path d='M0 9 L-10.5 -3 A14 14 0 0 1 10.5 -3 Z' fill='%23e8747c'/><path d='M0 9 L-6 1 A8.5 8.5 0 0 1 6 1 Z' fill='%23f4cf73'/><circle cx='0' cy='8' r='1.4' fill='%23c9a15a'/></g></g></svg>");
  }
  body[data-season="1"] .topbar{background:rgba(255,246,234,.97)}
  .nav .label[data-season]::before{
    content:"";
    display:none;
    width:22px;height:18px;
    margin-right:6px;
    vertical-align:-2px;
    background:center/contain no-repeat;
  }
  /* 1月：お正月（青海波・門松・鏡餅・扇） */
  .nav .label[data-season="1"]::before{display:inline-block;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 20'><path d='M12 19 L1.5 7 A14 14 0 0 1 22.5 7 Z' fill='%23e0525f'/><path d='M12 19 L6 11 A8.5 8.5 0 0 1 18 11 Z' fill='%23f4c95d'/><path d='M12 19 L12 5.5 M12 19 L6 8 M12 19 L18 8' stroke='%23fff' stroke-width='.7' opacity='.6'/><circle cx='12' cy='18' r='1.5' fill='%23b8894c'/></svg>")}
  .cal[data-season="1"]{
    border-color:#f3d9b8;
    background-color:#fffaf1;
    background-image:
      radial-gradient(circle at 100% 150%, #fffaf1 24%, #f5e4c8 24%, #f5e4c8 28%, #fffaf1 28%, #fffaf1 36%, #f5e4c8 36%, #f5e4c8 40%, transparent 40%, transparent),
      radial-gradient(circle at 0 150%, #fffaf1 24%, #f5e4c8 24%, #f5e4c8 28%, #fffaf1 28%, #fffaf1 36%, #f5e4c8 36%, #f5e4c8 40%, transparent 40%, transparent),
      radial-gradient(circle at 50% 100%, #f5e4c8 10%, #fffaf1 10%, #fffaf1 23%, #f5e4c8 23%, #f5e4c8 30%, #fffaf1 30%, #fffaf1 43%, #f5e4c8 43%, #f5e4c8 50%, #fffaf1 50%, #fffaf1 63%, #f5e4c8 63%, #f5e4c8 71%, transparent 71%, transparent),
      radial-gradient(circle at 100% 50%, #f5e4c8 5%, #fffaf1 5%, #fffaf1 15%, #f5e4c8 15%, #f5e4c8 20%, #fffaf1 20%, #fffaf1 29%, #f5e4c8 29%, #f5e4c8 34%, #fffaf1 34%, #fffaf1 44%, #f5e4c8 44%, #f5e4c8 49%, transparent 49%, transparent),
      radial-gradient(circle at 0 50%, #f5e4c8 5%, #fffaf1 5%, #fffaf1 15%, #f5e4c8 15%, #f5e4c8 20%, #fffaf1 20%, #fffaf1 29%, #f5e4c8 29%, #f5e4c8 34%, #fffaf1 34%, #fffaf1 44%, #f5e4c8 44%, #f5e4c8 49%, transparent 49%, transparent);
    background-size:36px 18px;
  }
  .cal[data-season="1"]::before{
    -webkit-mask:none;mask:none;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 46'><polygon points='8,16 14,11 14,34 8,34' fill='%2365b35e'/><polygon points='14,7 20,2 20,34 14,34' fill='%2357a653'/><polygon points='20,11 26,16 26,34 20,34' fill='%2365b35e'/><path d='M8 16 L14 11 M14 7 L20 2 M20 11 L26 16' stroke='%23d8efc0' stroke-width='1.6'/><circle cx='7' cy='31' r='5' fill='%233f7d47'/><circle cx='27' cy='31' r='5' fill='%233f7d47'/><circle cx='10' cy='27' r='3.5' fill='%234f8f55'/><circle cx='24' cy='27' r='3.5' fill='%234f8f55'/><circle cx='22' cy='30' r='1.7' fill='%23e0525f'/><circle cx='24.8' cy='28.4' r='1.7' fill='%23e0525f'/><rect x='5' y='32' width='24' height='13' rx='3' fill='%23dcb57e'/><rect x='5' y='36' width='24' height='3' fill='%23b8894c'/></svg>") center/contain no-repeat;
    width:30px;height:40px;
    top:-20px;left:-4px;
    transform:none;
  }
  .cal[data-season="1"]::after{
    -webkit-mask:none;mask:none;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect x='5' y='31' width='30' height='8' rx='2' fill='%23e0525f'/><rect x='9' y='33' width='22' height='3' rx='1.5' fill='%23f38b8f'/><path d='M4 30 L20 24 L36 30 Z' fill='%23fff' stroke='%23efe3d1'/><ellipse cx='20' cy='27' rx='15' ry='6.5' fill='%23fff' stroke='%23efe3d1'/><ellipse cx='20' cy='19.5' rx='11' ry='5.5' fill='%23fff' stroke='%23efe3d1'/><circle cx='20' cy='11' r='5' fill='%23ffa13d'/><ellipse cx='23.5' cy='6.5' rx='3' ry='1.6' fill='%235fae5a' transform='rotate(-25 23.5 6.5)'/></svg>") center/contain no-repeat;
    width:30px;height:30px;
    top:-16px;right:-9px;
    transform:none;
  }
  .cal[data-season="1"] .day{background:rgba(255,255,255,.82)}
  .cal[data-season="1"] .day.today{background:#fde6e2}
  .cal[data-season="1"] .day.today .n{background:#e0525f}
  .cal[data-season="1"] .day.sel{box-shadow:0 0 0 2px #c9474f inset}
  .cal[data-season="1"] .day.has-photo .n{color:#c9474f}
  .cal[data-season="1"] .wk{background:linear-gradient(#fdebe8,#fbd9d4);color:#c9474f}
  /* ---- 2月〜12月と4隅のイラスト（seasons.py で生成） ---- */

  /* ---- seasons.py で生成ここまで ---- */
  .panel{
    position:relative;
    margin-top:10px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:10px 10px 12px;
  }
  .panel::after{
    content:"";
    position:absolute;
    right:-4px;bottom:-8px;
    width:28px;height:28px;
    background:#ffc1d2;
    -webkit-mask:var(--flower) center/contain no-repeat;
    mask:var(--flower) center/contain no-repeat;
    transform:rotate(18deg);
  }
  .p-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    margin-bottom:8px;
  }
  .ribbon{
    display:inline-flex;align-items:center;gap:5px;
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,#ffa3bd,var(--accent));
    border-radius:999px;
    padding:2px 12px 2px 8px;
  }
  .ribbon .ic{color:#fff}
  .p-btns{display:flex;gap:6px}
  .chip{
    appearance:none;
    border:none;
    background:var(--accent-soft);
    color:var(--accent-deep);
    font-size:12px;
    font-weight:700;
    padding:4px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .p-photos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:4px 4px 12px;
  }
  .p-photos.n1{grid-template-columns:1fr;max-width:72%;margin-left:auto;margin-right:auto}
  .p-photos.n2{grid-template-columns:repeat(2,1fr)}
  .p-photos img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    background:#fff;
    padding:5px 5px 16px;
    border-radius:5px;
    box-shadow:0 3px 10px rgba(90,64,73,.2);
    cursor:zoom-in;
  }
  .p-photos img:nth-child(1){transform:rotate(-3deg)}
  .p-photos img:nth-child(2){transform:rotate(2.5deg)}
  .p-photos img:nth-child(3){transform:rotate(-1.5deg)}
  .p-memo{
    font-size:14px;
    line-height:26px;
    white-space:pre-wrap;
    word-break:break-word;
    background:#fffafb repeating-linear-gradient(transparent 0 25px,#ffe0e9 25px 26px);
    background-position:0 8px;
    border-radius:14px;
    padding:8px 12px;
  }
  .p-empty{
    text-align:center;
    padding:6px 0 4px;
  }
  .p-empty svg{width:84px;height:84px;display:block;margin:0 auto 4px}
  .p-empty p{margin:0 0 10px;font-size:13px;color:var(--ink-soft)}

  /* 最近のお花 */
  .recent{margin-top:14px}
  .sec-title{
    display:flex;align-items:center;gap:5px;
    font-size:13px;
    font-weight:700;
    color:var(--accent-deep);
    margin:0 4px 6px;
  }
  .sec-title .ic{color:var(--accent);width:16px;height:16px}
  .strip{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:4px 4px 8px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .strip button{
    flex:none;
    appearance:none;
    border:none;
    background:none;
    padding:0;
    width:70px;
    text-align:center;
    cursor:pointer;
  }
  .strip img{
    width:70px;height:70px;
    object-fit:cover;
    display:block;
    -webkit-mask:var(--flower) center/contain no-repeat;
    mask:var(--flower) center/contain no-repeat;
  }
  .strip span{
    display:block;
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    margin-top:2px;
  }

(function(){
  "use strict";

  var DB_NAME = "flowerDiary";
  var STORE = "entries";

  var THUMB_DIM = 240;    // カレンダー・地図ピン用の正方形サムネイル
  var WEEKDAYS = ["日","月","火","水","木","金","土"];

  var db = null;
  var entries = new Map();   // "YYYY-MM-DD" -> entry
  var urls = new Map();      // Blob -> object URL
  var currentTab = "month";
  var viewMonth = startOfMonth(new Date());
  var viewWeek = startOfWeek(new Date());
  var detailDate = null;
  var selectedDate = todayIso();
  var form = null;

  // ---------- 日付 ----------
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parseIso(s){ var p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function todayIso(){ return iso(new Date()); }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function startOfWeek(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay()); }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function fmtLong(s){
    var d = parseIso(s);
    return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日（" + WEEKDAYS[d.getDay()] + "）";
  }

  // ---------- 花言葉 ----------
  // ひらがなで打ってもカタカナの花の名前にヒットするように、カタカナにそろえて比べる
  function norm(s){
    return String(s || "").replace(/[\u3041-\u3096]/g, function(c){
      return String.fromCharCode(c.charCodeAt(0) + 0x60);
    }).replace(/\s/g, "").toLowerCase();
  }
  var DICT = (window.HANAKOTOBA || []).map(function(r){
    var paren = r[0].match(/（(.+?)）/);
    return { name: r[0], words: r[1], key: norm(r[0]), base: norm(r[0].split("（")[0]), paren: norm(paren ? paren[1] : "") };
  });
  // 「サクラ」「桜」のように括弧の外・中だけでも見つける
  function lookup(name){
    var k = norm(name);
    if(!k) return null;
    var exact = DICT.filter(function(d){ return d.key === k; })[0];
    return exact || DICT.filter(function(d){ return d.base === k || d.paren === k; })[0] || null;
  }
  function suggest(q){
    var k = norm(q), starts = [], contains = [];
    if(!k) return [];
    DICT.forEach(function(d){
      var i = d.key.indexOf(k);
      if(i === 0) starts.push(d);
      else if(i > 0) contains.push(d);
    });
    return starts.concat(contains).slice(0, 8);
  }
  function flowerOf(p){ return p.flower && p.flower.name ? p.flower : null; }
  // 写真ごとの花言葉カード（同じ花が続くときは1つにまとめる）
  function hkList(photos){
    var seen = {};
    return photos.filter(function(p){
      var f = flowerOf(p);
      if(!f) return false;
      var k = f.name + "|" + f.words;
      if(seen[k]) return false;
      return (seen[k] = true);
    }).map(function(p){
      var f = p.flower;
      return '<div class="hk"><img src="' + urlOf(p.thumb) + '" alt=""><div><b>' + esc(f.name) + "</b>" +
        (f.words ? "<span>" + esc(f.words) + "</span>" : "") + "</div></div>";
    }).join("");
  }

  // ---------- 保存（IndexedDB） ----------
  function openDB(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(STORE, { keyPath: "date" }); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function run(mode, fn){
    return new Promise(function(resolve, reject){
      var t = db.transaction(STORE, mode);
      var req = fn(t.objectStore(STORE));
      t.oncomplete = function(){ resolve(req ? req.result : undefined); };
      t.onerror = function(){ reject(t.error); };
      t.onabort = function(){ reject(t.error); };
    });
  }
  function dbAll(){ return run("readonly", function(s){ return s.getAll(); }); }
  function dbPut(e){ return run("readwrite", function(s){ return s.put(e); }); }
  function dbDelete(date){ return run("readwrite", function(s){ return s.delete(date); }); }

  function urlOf(blob){
    if(!urls.has(blob)) urls.set(blob, URL.createObjectURL(blob));
    return urls.get(blob);
  }

  // ---------- 表示の共通部品 ----------
  function toast(msg){
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function openOverlay(id){ $(id).classList.add("open"); }
  function closeOverlay(id){
    // iPhoneではボタンを押しても入力欄のフォーカスが外れないため、
    // 閉じる前に外さないとキーボードだけが画面に残る
    var el = $(id), active = document.activeElement;
    if(active && el.contains(active)) active.blur();
    el.classList.remove("open");
  }

  function updateSeason(){

    document.body.dataset.season = String(d.getMonth() + 1);

  // ---------- 月カレンダー ----------
  function renderMonth(){
    var y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    var last = new Date(y, m + 1, 0);
    var today = todayIso();
    $("mLabel").textContent = y + "年" + (m + 1) + "月";
    // 月ごとに季節の背景とイラストを切り替える
    $("mLabel").dataset.season = $("cal").dataset.season = String(m + 1);
    updateSeason();

    var html = '<div class="cal-row cal-head"><div></div>' + WEEKDAYS.map(function(w, i){
      return '<div class="' + (i === 0 ? "sun" : i === 6 ? "sat" : "") + '">' + w + "</div>";
    }).join("") + "</div>";

    for(var ws = startOfWeek(viewMonth); ws <= last; ws = addDays(ws, 7)){
      html += '<div class="cal-row"><button class="wk" data-week="' + iso(ws) + '">週</button>';
      for(var i = 0; i < 7; i++){
        var d = addDays(ws, i), key = iso(d), e = entries.get(key);
        var cls = ["day"];
        if(d.getMonth() !== m) cls.push("out");
        if(key === today) cls.push("today");
        if(key === selectedDate) cls.push("sel");
        if(key > today) cls.push("future");
        var inner = '<span class="n">' + d.getDate() + "</span>";
        if(e && e.photos.length){
          cls.push("has-photo");
          inner += '<img src="' + urlOf(e.photos[0].thumb) + '" alt="">';
        }else if(e){
          inner += '<svg class="mini"><use href="#i-flower"/></svg>';
        }
        html += '<button class="' + cls.join(" ") + '" data-date="' + key + '">' + inner + "</button>";
      }
      html += "</div>";
    }
    html += '<span class="deco bl"></span><span class="deco br"></span>';
    $("cal").innerHTML = html;
  }

  function renderPanel(){

  // ---------- 週表示 ----------
  function renderWeek(){

    $("wLabel").textContent = (viewWeek.getMonth()+1) + "/" + viewWeek.getDate() + " 〜 " + (end.getMonth()+1) + "/" + end.getDate();

  // ---------- 地図 ----------
  var map = null, markerLayer = null;

  function renderMap(focus){
    if(typeof L === "undefined"){
      $("mapMsg").textContent = "地図を読み込めませんでした。インターネットに接続してから開き直してください。";
      return;
    }
    if(!map){
      map = L.map("map");
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);
    }
    markerLayer.clearLayers();
    var points = [];
    Array.from(entries.values()).sort(function(a, b){ return a.date < b.date ? -1 : 1; }).forEach(function(e){
      var located = e.photos.filter(function(p){ return p.lat != null; });
      located.forEach(function(p){ addPin(e, [p.lat, p.lng], '<img src="' + urlOf(p.thumb) + '" alt="">', points, p); });
      if(!located.length && e.lat != null) addPin(e, [e.lat, e.lng], "", points);
    });

    $("mapMsg").textContent = points.length
      ? "ピンをタップすると、その日の記録が見られます"
      : "撮影場所のある記録がまだありません";

    map.invalidateSize();
    if(focus) map.setView(focus, 16);
    else if(points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 16 });
    else map.setView([36.2, 138.25], 5);
  }

  function addPin(e, latlng, inner, points, photo){
    var f = photo ? flowerOf(photo) : null;
    var icon = L.divIcon({
      className: "",
      html: '<div class="pin"><div class="petals"></div><div class="ph">' + inner + '</div><div class="stem"></div></div>',
      iconSize: [62, 78],
      iconAnchor: [31, 78],
      popupAnchor: [0, -72]
    });
    var box = document.createElement("div");
    box.className = "pop";
    box.innerHTML =
      '<div class="pd">' + esc(fmtLong(e.date)) + "</div>" +
      (f ? '<div class="pf">🌷 ' + esc(f.name) + (f.words ? "<small>花言葉：" + esc(f.words) + "</small>" : "") + "</div>" : "") +
      (e.memo ? '<div class="pm">' + esc(e.memo.length > 60 ? e.memo.slice(0, 60) + "…" : e.memo) + "</div>" : "") +
      "<button>この日の記録を見る</button>";
    box.querySelector("button").addEventListener("click", function(){ openDetail(e.date); });
    L.marker(latlng, { icon: icon }).bindPopup(box).addTo(markerLayer);
    points.push(latlng);
  }

  function firstLocation(e){
    for(var i = 0; i < e.photos.length; i++){
      if(e.photos[i].lat != null) return [e.photos[i].lat, e.photos[i].lng];
    }
    return e.lat != null ? [e.lat, e.lng] : null;
  }

  function deleteEntry(date, sheet){
    if(!confirm(fmtLong(date) + " の記録を削除しますか？")) return;

      entries.delete(date);
      closeOverlay(sheet);

  // ---------- 記録フォーム ----------
  function getHere(){
    return new Promise(function(resolve){
      if(!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        function(p){ resolve({ lat: p.coords.latitude, lng: p.coords.longitude }); },
        function(){ resolve(null); },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    });
  }

  function openForm(date){
    var e = entries.get(date);
    form = {
      original: e ? date : null,
      photos: e ? e.photos.slice() : [],
      here: null,
      hereDone: false,
      herePromise: null
    };
    $("formTitle").textContent = e ? "記録を編集" : "お花を記録する";
    $("fDate").value = date;
    $("fMemo").value = e ? e.memo : "";
    $("fDelete").style.display = e ? "" : "none";
    setWriting(false);
    renderSlots();
    updateGeo();
    openOverlay("formSheet");
  }

  // 今日の記録のときだけ現在地を取りにいく（過去の日に自宅の位置が入らないように）
  function updateGeo(){
    var el = $("geoStatus");
    var hasExif = form.photos.some(function(p){ return p.loc === "photo"; });
    if($("fDate").value !== todayIso()){
      el.textContent = hasExif ? "📍 写真の撮影場所を記録します" : "過去の日付では、写真に位置情報がある場合のみ撮影場所を記録します";
      return;
    }
    if(!form.herePromise){
      var f = form;
      f.herePromise = getHere().then(function(here){
        f.here = here;
        f.hereDone = true;
        if(form === f) updateGeo();
        return here;
      });
    }
    if(!form.hereDone) el.textContent = "📍 現在地を確認しています…";
    else if(form.here) el.textContent = "📍 撮影場所を記録します（写真に位置情報がない場合は現在地）";
    else el.textContent = hasExif ? "📍 写真の撮影場所を記録します" : "現在地を取得できませんでした（位置情報の許可を確認してください）";
  }
  $("fDate").addEventListener("change", updateGeo);

  function renderSlots(){

  // 写真ごとに「花の名前」と「花言葉」を入力する欄
  function renderFlowerRows(){
    $("flowerRows").innerHTML = form.photos.length ? "<label>花の名前と花言葉</label>" + form.photos.map(function(p, i){
      var f = p.flower || {};

        '<span class="fph"><img src="' + urlOf(p.thumb) + '" alt="" decoding="async"><svg class="ic"><use href="#i-flower"/></svg></span>' +
        '<div class="fcol">' +

          '<div class="sugg"></div>' +

  function setFlower(i, patch){
    var p = form.photos[i];
    var f = Object.assign({ name: "", words: "" }, p.flower || {}, patch);
    form.photos[i] = Object.assign({}, p, { flower: f });

  function pickFlower(row, d){
    row.querySelector(".fname").value = d.name;
    row.querySelector(".fwords").value = d.words;
    row.querySelector(".sugg").innerHTML = "";
    row.dataset.auto = "1";
    setFlower(Number(row.dataset.i), { name: d.name, words: d.words });
  }

  $("flowerRows").addEventListener("input", function(ev){
    var row = ev.target.closest(".frow");
    if(!row) return;
    var i = Number(row.dataset.i);
    if(ev.target.classList.contains("fname")){
      var name = ev.target.value, words = row.querySelector(".fwords");
      var hit = lookup(name);
      // 自動で入れた花言葉だけ書き換える（自分で書いた花言葉は消さない）
      if(!words.value || row.dataset.auto === "1"){
        words.value = hit ? hit.words : "";
        row.dataset.auto = hit ? "1" : "0";
      }
      setFlower(i, { name: name.trim(), words: words.value.trim() });
      row._sugg = suggest(name).filter(function(d){ return d.name !== name; });
      row.querySelector(".sugg").innerHTML = row._sugg.map(function(d, n){
        return '<button type="button" data-n="' + n + '">' + esc(d.name) + "</button>";
      }).join("");
    }else if(ev.target.classList.contains("fwords")){
      row.dataset.auto = "0";
      setFlower(i, { words: ev.target.value.trim() });
    }
  });
  // 候補のタップは、入力欄のフォーカスが外れる前に拾う
  $("flowerRows").addEventListener("pointerdown", function(ev){
    var b = ev.target.closest(".sugg button");
    if(!b) return;
    ev.preventDefault();
    var row = b.closest(".frow");
    pickFlower(row, row._sugg[Number(b.dataset.n)]);
  });
  $("flowerRows").addEventListener("focusout", function(ev){
    if(!ev.target.classList.contains("fname")) return;
    var sugg = ev.target.closest(".frow").querySelector(".sugg");
    setTimeout(function(){ sugg.innerHTML = ""; }, 200);
  });

  $("slots").addEventListener("click", function(ev){
    var rm = ev.target.closest(".rm");
    if(rm){
      form.photos.splice(Number(rm.dataset.i), 1);
      renderSlots();
      updateGeo();
      return;
    }
    if(ev.target.closest("#slotAdd")) $("fPhoto").click();
  });

  $("fPhoto").addEventListener("change", function(ev){
    var files = Array.from(ev.target.files || []);
    ev.target.value = "";
    var room = MAX_PHOTOS - form.photos.length;
    if(files.length > room) toast("写真は1日" + MAX_PHOTOS + "枚までです");
    var f = form;
    Promise.all(files.slice(0, room).map(preparePhoto)).then(function(list){
      if(form !== f) return;
      f.photos = f.photos.concat(list);
      renderSlots();
      updateGeo();
    }).catch(function(){ toast("写真を読み込めませんでした"); });
  });

  function preparePhoto(file){
    return Promise.all([readGps(file), loadImage(file)]).then(function(r){
      var gps = r[0], img = r[1];
      return Promise.all([resize(img, FULL_DIM, false), resize(img, THUMB_DIM, true)]).then(function(b){
        return {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
          full: b[0],
          thumb: b[1],
          lat: gps ? gps.lat : null,
          lng: gps ? gps.lng : null,
          loc: gps ? "photo" : null
        };
      });
    });
  }

  function loadImage(file){
    return new Promise(function(resolve, reject){
      var u = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){ URL.revokeObjectURL(u); resolve(img); };
      img.onerror = function(){ URL.revokeObjectURL(u); reject(new Error("image")); };
      img.src = u;
    });
  }

  function resize(img, dim, square){
    var w = img.naturalWidth, h = img.naturalHeight;
    var sx = 0, sy = 0, sw = w, sh = h, cw, ch;
    if(square){
      var side = Math.min(w, h);
      sx = (w - side) / 2; sy = (h - side) / 2; sw = sh = side;
      cw = ch = Math.min(dim, side);
    }else{
      var s = Math.min(1, dim / Math.max(w, h));
      cw = Math.round(w * s); ch = Math.round(h * s);
    }
    var c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    return new Promise(function(resolve, reject){
      c.toBlob(function(b){ b ? resolve(b) : reject(new Error("blob")); }, "image/jpeg", square ? 0.8 : 0.78);
    });
  }

  // JPEGのEXIFからGPS座標を読む（縮小するとEXIFが消えるので元ファイルから読む）
  function readGps(file){
    return file.slice(0, 256 * 1024).arrayBuffer().then(function(buf){
      var v = new DataView(buf);
      if(v.getUint16(0) !== 0xFFD8) return null;
      var off = 2;
      while(off + 4 <= v.byteLength){
        var marker = v.getUint16(off);
        if((marker & 0xFF00) !== 0xFF00 || marker === 0xFFDA) return null;
        if(marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) return parseGps(v, off + 10);
        off += 2 + v.getUint16(off + 2);
      }
      return null;
    }).catch(function(){ return null; });
  }

  function parseGps(v, t){
    var le = v.getUint16(t) === 0x4949;
    var u16 = function(o){ return v.getUint16(t + o, le); };
    var u32 = function(o){ return v.getUint32(t + o, le); };
    var ifd = u32(4), n = u16(ifd), gps = 0;
    for(var i = 0; i < n; i++){
      var e = ifd + 2 + i * 12;
      if(u16(e) === 0x8825){ gps = u32(e + 8); break; }
    }
    if(!gps) return null;
    var tags = {}, gn = u16(gps);
    for(var j = 0; j < gn; j++){
      var g = gps + 2 + j * 12, tag = u16(g), type = u16(g + 2), count = u32(g + 4);
      if((tag === 1 || tag === 3) && type === 2){
        tags[tag] = String.fromCharCode(v.getUint8(t + g + 8));
      }else if((tag === 2 || tag === 4) && type === 5 && count === 3){
        var p = u32(g + 8);
        var r = function(k){ return u32(p + k * 8) / u32(p + k * 8 + 4); };
        tags[tag] = r(0) + r(1) / 60 + r(2) / 3600;
      }
    }
    var lat = tags[2], lng = tags[4];
    if(!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return null;
    if(tags[1] === "S") lat = -lat;
    if(tags[3] === "W") lng = -lng;
    return { lat: lat, lng: lng };
  }

  // ---------- 書くモード ----------
  // メモ欄を打っている間だけ、メモ欄以外を表示しない
  var savedScroll = 0;
  // iPhoneはメモ欄をタップした瞬間、キーボードに隠れないよう画面をスクロールする。
  // その直後にメモ欄が画面の上に移るので、スクロールした分だけはみ出して見えなくなる。
  // 書くモードに入ったら、キーボードが出きるまで何度か一番上に戻す。
  function resetWritingScroll(){
    if(!document.body.classList.contains("writing")) return;
    window.scrollTo(0, 0);
    $("formSheet").querySelector(".sheet").scrollTop = 0;
  }
  function setWriting(on){
    var sheet = $("formSheet");
    if(on){
      if(sheet.dataset.writing) return;
      savedScroll = window.pageYOffset;
      sheet.dataset.writing = "memo";
      document.body.classList.add("writing");
      resetWritingScroll();
      requestAnimationFrame(resetWritingScroll);
      [80, 250, 500].forEach(function(t){ setTimeout(resetWritingScroll, t); });
    }else{
      if(!sheet.dataset.writing) return;
      delete sheet.dataset.writing;
      document.body.classList.remove("writing");
      window.scrollTo(0, savedScroll);
    }
  }
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resetWritingScroll);
  $("formSheet").addEventListener("focusin", function(ev){
    if(ev.target.id === "fMemo") setWriting(true);
  });
  $("formSheet").addEventListener("focusout", function(ev){
    if(ev.target.id !== "fMemo") return;
    setTimeout(function(){
      if(document.activeElement !== $("fMemo")) setWriting(false);
    }, 0);
  });
  $("wDone").addEventListener("pointerdown", function(ev){ ev.preventDefault(); });
  $("wDone").addEventListener("click", function(){
    if(document.activeElement) document.activeElement.blur();
    setWriting(false);
  });

  $("btnAdd").addEventListener("click", function(){ openForm(todayIso()); });
  $("btnCancel").addEventListener("click", function(){ closeOverlay("formSheet"); form = null; });

  $("btnSave").addEventListener("click", function(){
    var btn = this;
    var f = form;
    var date = $("fDate").value;
    var memo = $("fMemo").value.trim();
    if(!date){ toast("日付を選んでください"); return; }
    if(date > todayIso()){ toast("未来の日付には記録できません"); return; }
    if(!memo && !f.photos.length){ toast("写真かメモを入れてください"); return; }
    if(date !== f.original && entries.has(date) &&
       !confirm(fmtLong(date) + " にはすでに記録があります。上書きしますか？")) return;

    var isToday = date === todayIso();
    btn.disabled = true;
    btn.textContent = "保存中…";
    var wait = isToday && f.herePromise ? f.herePromise : Promise.resolve(null);
    wait.then(function(here){
      var prev = f.original ? entries.get(f.original) : null;
      var photos = f.photos.map(function(p){
        if(p.flower && !p.flower.name){
          p = Object.assign({}, p);
          delete p.flower;
        }
        if(p.lat == null && isToday && here) return Object.assign({}, p, { lat: here.lat, lng: here.lng, loc: "here" });
        return p;
      });
      var entry = {
        date: date,
        memo: memo,
        photos: photos,
        lat: prev && prev.lat != null ? prev.lat : (isToday && here ? here.lat : null),
        lng: prev && prev.lng != null ? prev.lng : (isToday && here ? here.lng : null),
        createdAt: prev ? prev.createdAt : Date.now(),
        updatedAt: Date.now()
      };
      return dbPut(entry).then(function(){
        if(f.original && f.original !== date) return dbDelete(f.original);
      }).then(function(){
        if(f.original) entries.delete(f.original);
        entries.set(date, entry);
        selectedDate = date;
        viewMonth = startOfMonth(parseIso(date));
        closeOverlay("formSheet");
        form = null;
        renderAll();
        toast("保存しました 🌸");
      });
    }).catch(function(err){
      console.error(err);
      toast("保存できませんでした。空き容量を確認してください");
    }).then(function(){
      btn.disabled = false;
      btn.textContent = "保存する";
    });
  });

  // ---------- バックアップ ----------
  function blobToDataUrl(blob){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function dataUrlToBlob(url){ return fetch(url).then(function(r){ return r.blob(); }); }

  $("btnExport").addEventListener("click", function(){
    var list = Array.from(entries.values());
    if(!list.length){ toast("まだ記録がありません"); return; }
    toast("バックアップを作成しています…");
    Promise.all(list.map(function(e){
      return Promise.all(e.photos.map(function(p){
        return Promise.all([blobToDataUrl(p.full), blobToDataUrl(p.thumb)]).then(function(d){
          return Object.assign({}, p, { full: d[0], thumb: d[1] });
        });
      })).then(function(photos){ return Object.assign({}, e, { photos: photos }); });
    })).then(function(out){
      var blob = new Blob([JSON.stringify({ app: "flower-diary", version: 1, entries: out })], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "flower-diary-" + todayIso() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 10000);
    }).catch(function(){ toast("バックアップを作成できませんでした"); });
  });

  $("btnImport").addEventListener("click", function(){ $("fileImport").click(); });
  $("fileImport").addEventListener("change", function(ev){
    var file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if(!file) return;
    file.text().then(function(text){
      var data = JSON.parse(text);
      if(!data || data.app !== "flower-diary" || !Array.isArray(data.entries)) throw new Error("format");
      // すでに記録がある日はそのまま残し、ない日だけ追加する
      var fresh = data.entries.filter(function(e){ return e && e.date && !entries.has(e.date); });
      return Promise.all(fresh.map(function(e){
        return Promise.all((e.photos || []).map(function(p){
          return Promise.all([dataUrlToBlob(p.full), dataUrlToBlob(p.thumb)]).then(function(b){
            return Object.assign({}, p, { full: b[0], thumb: b[1] });
          });
        })).then(function(photos){
          var entry = Object.assign({}, e, { memo: e.memo || "", photos: photos });
          return dbPut(entry).then(function(){ entries.set(entry.date, entry); });
        });
      })).then(function(){
        closeOverlay("settingsSheet");
        renderAll();
        toast("読み込みました（" + fresh.length + "日分を追加）");
      });
    }).catch(function(err){
      console.error(err);
      toast("読み込めませんでした。ファイルを確認してください");
    });
  });

  // ---------- 起動 ----------
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click", function(){ switchTab(b.dataset.tab); });
  });
  $("btnSettings").addEventListener("click", function(){ openOverlay("settingsSheet"); });
  $("btnSettingsClose").addEventListener("click", function(){ closeOverlay("settingsSheet"); });
  $("settingsSheet").addEventListener("click", function(ev){ if(ev.target.id === "settingsSheet") closeOverlay("settingsSheet"); });
  // 外側をタップしたら閉じる。ただし押し始めも外側だったときだけ
  // （入力欄をタップして書くモードに切り替わると配置が変わり、指を離した位置が外側になることがあるため）
  var formDownOutside = false;
  $("formSheet").addEventListener("pointerdown", function(ev){ formDownOutside = ev.target.id === "formSheet"; });
  $("formSheet").addEventListener("click", function(ev){
    if(ev.target.id === "formSheet" && formDownOutside && !$("formSheet").dataset.writing){ closeOverlay("formSheet"); form = null; }
    formDownOutside = false;
  });

  if(navigator.storage && navigator.storage.persist) navigator.storage.persist();

  openDB().then(function(d){
    db = d;
    return dbAll();
  }).then(function(list){
    list.forEach(function(e){ entries.set(e.date, e); });
    renderAll();
  }).catch(function(err){
    console.error(err);
    renderAll();
    toast("保存領域を開けませんでした（プライベートブラウズでは使えません）");
  });
})();
</script>
</body>
</html>
