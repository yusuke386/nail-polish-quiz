<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お花日記</title>
<style>
  :root{
    --bg:#f7f6ef;
    --card:#ffffff;
    --ink:#3b3a33;
    --ink-soft:#8b8a7c;
    --line:#e7e4d8;
    --accent:#7c8f5a;
    --accent-soft:#e9efdd;
    --pink:#c98a93;
    --pink-soft:#f6e6e8;
    --shadow:0 6px 24px rgba(80,80,50,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding:22px 16px calc(90px + env(safe-area-inset-bottom));
  }
  .brand{
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--pink);
    margin-bottom:6px;
  }
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:.04em;
    margin:0 0 4px;
  }
  .lead{color:var(--ink-soft);font-size:13px;margin:0 0 18px}

  /* トップバーの操作 */
  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:12px;
    padding:8px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* 一覧 */
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:48px 12px;
    border:1px dashed var(--line);
    border-radius:16px;
  }
  .entry{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:14px;
  }
  .entry .date{
    font-size:11px;
    letter-spacing:.08em;
    color:var(--pink);
    margin-bottom:6px;
  }
  .entry .title{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:17px;
    font-weight:600;
    margin-bottom:8px;
  }
  .entry .photos{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:10px;
    -webkit-overflow-scrolling:touch;
  }
  .entry .photos img{
    width:104px;
    height:104px;
    object-fit:cover;
    border-radius:12px;
    flex:none;
    background:var(--accent-soft);
  }
  .entry .memo{
    font-size:14px;
    white-space:pre-wrap;
    color:var(--ink);
    margin-bottom:10px;
  }
  .entry .row-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }
  .entry .row-actions button{
    appearance:none;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    padding:4px 6px;
  }
  .entry .row-actions button.danger{color:#b25555}

  /* フローティング追加ボタン */
  .fab{
    position:fixed;
    right:20px;
    bottom:calc(20px + env(safe-area-inset-bottom));
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--pink);
    color:#fff;
    border:none;
    font-size:28px;
    box-shadow:0 8px 20px rgba(180,90,100,.35);
    cursor:pointer;
    line-height:1;
  }
  .fab:active{transform:scale(.95)}

  /* モーダル（入力フォーム） */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(40,35,25,.4);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex}
  .sheet{
    background:var(--bg);
    width:100%;
    max-width:480px;
    max-height:92vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h2{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:18px;
    margin:0 0 14px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin:14px 0 6px;
  }
  input[type="date"],
  input[type="text"],
  textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:12px;
    padding:10px 12px;
    font-size:14px;
    color:var(--ink);
    font-family:inherit;
  }
  textarea{min-height:90px;resize:vertical}
  .photo-input{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .photo-input .thumb{
    position:relative;
    width:76px;
    height:76px;
  }
  .photo-input .thumb img{
    width:100%;height:100%;object-fit:cover;border-radius:10px;
  }
  .photo-input .thumb .rm{
    position:absolute;top:-6px;right:-6px;
    width:20px;height:20px;border-radius:50%;
    background:#b25555;color:#fff;border:none;font-size:12px;
    line-height:20px;text-align:center;padding:0;cursor:pointer;
  }
  .photo-add{
    width:76px;height:76px;
    border:1px dashed var(--line);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    font-size:24px;
    cursor:pointer;
    background:var(--card);
  }
  .sheet .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .sheet .actions button{flex:1}
  .sheet .actions .btn{padding:11px 12px;font-size:14px}

  .foot{margin-top:10px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
  .toast{
    position:fixed;
    left:50%;top:18px;
    transform:translateX(-50%);
    background:#3b3a33;
    color:#fff;
    font-size:12px;
    padding:8px 16px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:100;
  }
  .toast.show{opacity:.92}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">FLOWER DIARY</div>
  <h1>お花日記</h1>
  <p class="lead">見つけたお花や飾ったお花を記録します</p>

  <div class="toolbar">
    <button class="btn" id="btnExport">書き出し（バックアップ）</button>
    <button class="btn" id="btnImport">読み込み</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none">
  </div>

  <div id="list"></div>
</div>

<button class="fab" id="btnAdd" aria-label="記録を追加">＋</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">お花を記録する</h2>
    <input type="hidden" id="editId">

    <label for="fDate">日付</label>
    <input type="date" id="fDate">

    <label for="fTitle">お花の名前・タイトル</label>
    <input type="text" id="fTitle" placeholder="例）チューリップ、いただいた花束 など">

    <label>写真</label>
    <div class="photo-input" id="photoList"></div>
    <div class="photo-add" id="photoAdd">＋</div>
    <input type="file" id="fPhoto" accept="image/*" capture="environment" multiple style="display:none">

    <label for="fMemo">メモ</label>
    <textarea id="fMemo" placeholder="色や香り、感じたことなど自由に"></textarea>

    <div class="actions">
      <button class="btn" id="btnCancel">キャンセル</button>
      <button class="btn primary" id="btnSave">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "flowerDiaryEntries.v1";
  var MAX_DIM = 1000;      // 保存前に長辺をこのサイズまで縮小
  var JPEG_QUALITY = 0.72;

  var listEl = document.getElementById("list");
  var overlay = document.getElementById("overlay");
  var photoListEl = document.getElementById("photoList");
  var toastEl = document.getElementById("toast");

  var currentPhotos = []; // 編集中の写真（base64配列）
  var editId = null;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("読み込みに失敗しました", e);
      return [];
    }
  }
  function save(entries){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      return true;
    }catch(e){
      console.error("保存に失敗しました", e);
      toast("保存に失敗しました。写真の枚数を減らしてお試しください。");
      return false;
    }
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtDate(iso){
    if(!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if(isNaN(d.getTime())) return iso;
    var w = ["日","月","火","水","木","金","土"][d.getDay()];
    return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日（" + w + "）";
  }

  function render(){
    var entries = load().slice().sort(function(a,b){
      return (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0);
    });
    if(entries.length === 0){
      listEl.innerHTML = '<div class="empty">まだ記録がありません<br>右下の＋から追加してください</div>';
      return;
    }
    listEl.innerHTML = entries.map(function(e){
      var photos = (e.photos||[]).map(function(p){
        return '<img src="'+p+'" alt="">';
      }).join("");
      return (
        '<div class="entry" data-id="'+e.id+'">' +
          '<div class="date">'+escapeHtml(fmtDate(e.date))+'</div>' +
          (e.title ? '<div class="title">'+escapeHtml(e.title)+'</div>' : '') +
          (photos ? '<div class="photos">'+photos+'</div>' : '') +
          (e.memo ? '<div class="memo">'+escapeHtml(e.memo)+'</div>' : '') +
          '<div class="row-actions">' +
            '<button data-act="edit">編集</button>' +
            '<button data-act="del" class="danger">削除</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function todayIso(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }

  function openSheet(entry){
    editId = entry ? entry.id : null;
    document.getElementById("sheetTitle").textContent = entry ? "記録を編集" : "お花を記録する";
    document.getElementById("fDate").value = entry ? entry.date : todayIso();
    document.getElementById("fTitle").value = entry ? (entry.title||"") : "";
    document.getElementById("fMemo").value = entry ? (entry.memo||"") : "";
    currentPhotos = entry && entry.photos ? entry.photos.slice() : [];
    renderPhotoInputs();
    overlay.classList.add("open");
  }
  function closeSheet(){
    overlay.classList.remove("open");
    currentPhotos = [];
    editId = null;
  }

  function renderPhotoInputs(){
    photoListEl.innerHTML = currentPhotos.map(function(p, i){
      return (
        '<div class="thumb">' +
          '<img src="'+p+'" alt="">' +
          '<button class="rm" data-i="'+i+'" aria-label="削除">×</button>' +
        '</div>'
      );
    }).join("");
  }

  photoListEl.addEventListener("click", function(ev){
    var btn = ev.target.closest(".rm");
    if(!btn) return;
    var i = parseInt(btn.dataset.i, 10);
    currentPhotos.splice(i, 1);
    renderPhotoInputs();
  });

  document.getElementById("photoAdd").addEventListener("click", function(){
    document.getElementById("fPhoto").click();
  });

  function resizeImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if(w > MAX_DIM || h > MAX_DIM){
            if(w >= h){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
            else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
          }
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("fPhoto").addEventListener("change", function(ev){
    var files = Array.prototype.slice.call(ev.target.files || []);
    if(files.length === 0) return;
    Promise.all(files.map(resizeImage)).then(function(dataUrls){
      currentPhotos = currentPhotos.concat(dataUrls);
      renderPhotoInputs();
    }).catch(function(){
      toast("写真の読み込みに失敗しました");
    });
    ev.target.value = "";
  });

  document.getElementById("btnAdd").addEventListener("click", function(){ openSheet(null); });
  document.getElementById("btnCancel").addEventListener("click", closeSheet);
  overlay.addEventListener("click", function(ev){
    if(ev.target === overlay) closeSheet();
  });

  document.getElementById("btnSave").addEventListener("click", function(){
    var date = document.getElementById("fDate").value || todayIso();
    var title = document.getElementById("fTitle").value.trim();
    var memo = document.getElementById("fMemo").value.trim();

    var entries = load();
    if(editId){
      var idx = entries.findIndex(function(e){ return e.id === editId; });
      if(idx >= 0){
        entries[idx].date = date;
        entries[idx].title = title;
        entries[idx].memo = memo;
        entries[idx].photos = currentPhotos;
      }
    } else {
      entries.push({
        id: (Date.now().toString(36) + Math.random().toString(36).slice(2,8)),
        date: date,
        title: title,
        memo: memo,
        photos: currentPhotos,
        createdAt: Date.now()
      });
    }
    if(save(entries)){
      closeSheet();
      render();
      toast("保存しました");
    }
  });

  listEl.addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-act]");
    if(!btn) return;
    var card = ev.target.closest(".entry");
    var id = card.dataset.id;
    var entries = load();
    if(btn.dataset.act === "edit"){
      var entry = entries.find(function(e){ return e.id === id; });
      if(entry) openSheet(entry);
    } else if(btn.dataset.act === "del"){
      if(confirm("この記録を削除しますか？")){
        entries = entries.filter(function(e){ return e.id !== id; });
        save(entries);
        render();
        toast("削除しました");
      }
    }
  });

  // バックアップ（書き出し・読み込み）
  document.getElementById("btnExport").addEventListener("click", function(){
    var entries = load();
    if(entries.length === 0){
      toast("記録がありません");
      return;
    }
    var blob = new Blob([JSON.stringify(entries, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = todayIso();
    a.href = url;
    a.download = "flower-diary-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("btnImport").addEventListener("click", function(){
    document.getElementById("fileImport").click();
  });
  document.getElementById("fileImport").addEventListener("change", function(ev){
    var file = ev.target.files && ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var imported = JSON.parse(e.target.result);
        if(!Array.isArray(imported)) throw new Error("形式が不正です");
        var existing = load();
        var existingIds = new Set(existing.map(function(x){ return x.id; }));
        var merged = existing.concat(imported.filter(function(x){
          return x && x.id && !existingIds.has(x.id);
        }));
        save(merged);
        render();
        toast("読み込みました（" + (merged.length - existing.length) + "件追加）");
      }catch(err){
        console.error(err);
        toast("読み込みに失敗しました。ファイルを確認してください。");
      }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  render();
})();
</script>
</body>
</html>
